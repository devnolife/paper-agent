name: ci
on:
  push:
    branches: [main, bench, translate]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes paper_agent tests experiments paper_bench
      - run: python -m pytest -q
      - name: AcademicBench release recomputes from its per-item scores
        run: python experiments/bench/verify_release.py
      - name: README result tables match the released data
        run: python experiments/bench/make_results_md.py --check
